<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- PWA / Android -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030712">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    @media (max-width: 600px) {
      .app-shell { padding: 12px 10px 90px; }
      .hud-header { padding: 12px 14px; }
      .sys-player-line { font-size: 17px; }
      .hud-card { padding: 14px; }
      .card-title { font-size: 17px; }
      .btn { min-height: 44px; }
      .btn-sm { min-height: 38px; }
      .plus-btn { width: 36px; height: 36px; }
      .quest-item { flex-direction: column; align-items: stretch; }
      .quest-item > div:last-child { display: flex; gap: 6px; }
      .quest-item > div:last-child .btn { flex: 1; }
      input[type="range"] { height: 32px; }
      .hud-nav {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 500;
        margin: 0; padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
        background: rgba(3, 7, 18, 0.96); border-top: 1px solid var(--border-hud);
        backdrop-filter: blur(10px);
      }
      .hud-tab { font-size: 11px; padding: 9px 11px; }
      .modal-box { padding: 20px; }
    }
    input, select, textarea { font-size: 16px !important; }
  </style>
  <title>[SYSTEM] — Okno Statusu & Przebudzenie Gracza</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-void: #030712;
      --bg-panel: rgba(8, 17, 38, 0.88);
      --bg-panel-light: rgba(13, 27, 58, 0.78);
      --bg-input: rgba(4, 10, 24, 0.9);
      --cyan: #00e5ff;
      --cyan-dim: rgba(0, 229, 255, 0.22);
      --cyan-glow: rgba(0, 229, 255, 0.55);
      --blue: #38bdf8;
      --purple: #a855f7;
      --purple-glow: rgba(168, 85, 247, 0.45);
      --gold: #fbbf24;
      --gold-dim: rgba(251, 191, 36, 0.2);
      --crimson: #f43f5e;
      --crimson-dim: rgba(244, 63, 94, 0.22);
      --emerald: #10b981;
      --text-main: #e2f1ff;
      --text-muted: #7fa2c7;
      --border-hud: rgba(0, 229, 255, 0.35);
      --shadow-hud: 0 0 25px rgba(0, 229, 255, 0.12), inset 0 0 20px rgba(0, 229, 255, 0.05);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-void);
      background-image:
        radial-gradient(circle at 15% 15%, rgba(0, 229, 255, 0.09), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.10), transparent 40%),
        linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.55;
    }

    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }

    button { cursor: pointer; }

    .app-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 18px 60px;
    }

    /* HUD HEADER */
    .hud-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 22px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, rgba(8, 22, 48, 0.95), rgba(14, 18, 42, 0.92));
      border: 1px solid var(--border-hud);
      box-shadow: var(--shadow-hud);
      position: relative;
      overflow: hidden;
    }

    .hud-header::before, .hud-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
    }

    .sys-title-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .sys-crest {
      width: 50px;
      height: 50px;
      border: 1px solid var(--cyan);
      box-shadow: 0 0 15px var(--cyan-dim), inset 0 0 12px var(--cyan-dim);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 22px;
      color: var(--cyan);
      letter-spacing: 1px;
      background: rgba(0, 229, 255, 0.06);
    }

    .sys-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--cyan);
      margin: 0;
      font-weight: 700;
    }

    .sys-player-line {
      margin: 2px 0 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      background: rgba(0, 229, 255, 0.12);
      text-transform: uppercase;
    }

    .rank-badge.s-rank {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(251, 191, 36, 0.15);
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.35);
    }

    .rank-badge.monarch {
      border-color: var(--purple);
      color: #e9d5ff;
      background: rgba(168, 85, 247, 0.25);
      box-shadow: 0 0 14px var(--purple-glow);
    }

    .hud-quickbars {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .mini-stat {
      text-align: right;
    }

    .mini-stat span {
      display: block;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .mini-stat strong {
      font-size: 17px;
      color: var(--cyan);
    }

    .mini-stat.gold strong { color: var(--gold); }
    .mini-stat.streak strong { color: var(--purple); }

    /* NAVIGATION */
    .hud-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 20px;
      scrollbar-width: thin;
    }

    .hud-tab {
      flex: 0 0 auto;
      background: rgba(8, 19, 43, 0.8);
      border: 1px solid rgba(0, 229, 255, 0.22);
      color: var(--text-muted);
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.18s ease;
    }

    .hud-tab:hover {
      border-color: var(--cyan);
      color: var(--text-main);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
    }

    .hud-tab.active {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.22), rgba(168, 85, 247, 0.18));
      border-color: var(--cyan);
      color: #ffffff;
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.28);
    }

    /* CARDS & GRIDS */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .hud-card {
      position: relative;
      background: var(--bg-panel);
      border: 1px solid var(--border-hud);
      box-shadow: var(--shadow-hud);
      padding: 20px;
      margin-bottom: 18px;
      backdrop-filter: blur(8px);
    }

    .hud-card.purple-card {
      border-color: rgba(168, 85, 247, 0.45);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.12);
    }

    .hud-card.danger-card {
      border-color: rgba(244, 63, 94, 0.5);
      box-shadow: 0 0 25px rgba(244, 63, 94, 0.12);
    }

    .section-tag {
      margin: 0 0 4px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cyan);
    }

    .section-tag.purple { color: #c084fc; }
    .section-tag.gold { color: var(--gold); }
    .section-tag.crimson { color: var(--crimson); }

    .card-title {
      margin: 0 0 10px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
    }

    .muted { color: var(--text-muted); font-size: 13.5px; }

    /* PROGRESS BARS */
    .bar-wrap {
      margin: 10px 0;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .bar-track {
      height: 10px;
      background: rgba(2, 8, 20, 0.95);
      border: 1px solid rgba(0, 229, 255, 0.28);
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--blue));
      box-shadow: 0 0 12px var(--cyan);
      transition: width 0.35s ease;
    }

    .bar-fill.hp { background: linear-gradient(90deg, #10b981, #34d399); box-shadow: 0 0 10px #10b981; }
    .bar-fill.mp { background: linear-gradient(90deg, #3b82f6, #00e5ff); box-shadow: 0 0 10px #00e5ff; }
    .bar-fill.fatigue { background: linear-gradient(90deg, #f59e0b, #f43f5e); box-shadow: 0 0 10px #f43f5e; }
    .bar-fill.boss { background: linear-gradient(90deg, #dc2626, #f43f5e); box-shadow: 0 0 12px #f43f5e; }
    .bar-fill.purple { background: linear-gradient(90deg, #7c3aed, #c084fc); box-shadow: 0 0 12px #a855f7; }

    /* STAT ATTRIBUTES LIST */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .stat-box {
      background: var(--bg-panel-light);
      border: 1px solid rgba(0, 229, 255, 0.22);
      padding: 11px 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .stat-code {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.14em;
      color: var(--cyan);
    }

    .stat-name {
      font-size: 13px;
      color: var(--text-main);
      font-weight: 600;
    }

    .stat-desc {
      font-size: 11px;
      color: var(--text-muted);
    }

    .stat-val-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-val {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 10px var(--cyan-glow);
    }

    .plus-btn {
      width: 28px;
      height: 28px;
      border: 1px solid var(--gold);
      background: rgba(251, 191, 36, 0.15);
      color: var(--gold);
      font-weight: 900;
      display: grid;
      place-items: center;
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.35);
    }

    .plus-btn:hover {
      background: var(--gold);
      color: #000;
    }

    /* FORMS & INPUTS */
    .field {
      display: block;
      margin-bottom: 13px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-main);
    }

    .field small {
      display: block;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 2px;
    }

    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      background: var(--bg-input);
      border: 1px solid rgba(0, 229, 255, 0.28);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    textarea {
      min-height: 82px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.25);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 16px;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--cyan);
      background: rgba(0, 229, 255, 0.14);
      color: #fff;
      transition: all 0.16s ease;
    }

    .btn:hover {
      background: rgba(0, 229, 255, 0.28);
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.35);
      transform: translateY(-1px);
    }

    .btn-purple {
      border-color: var(--purple);
      background: rgba(168, 85, 247, 0.18);
    }

    .btn-purple:hover {
      background: rgba(168, 85, 247, 0.35);
      box-shadow: 0 0 16px var(--purple-glow);
    }

    .btn-gold {
      border-color: var(--gold);
      background: rgba(251, 191, 36, 0.16);
      color: var(--gold);
    }

    .btn-gold:hover {
      background: rgba(251, 191, 36, 0.3);
      box-shadow: 0 0 14px rgba(251, 191, 36, 0.35);
    }

    .btn-danger {
      border-color: var(--crimson);
      background: rgba(244, 63, 94, 0.14);
      color: #fda4af;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 11px;
    }

    /* QUEST ITEMS */
    .quest-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      background: var(--bg-panel-light);
      border: 1px solid rgba(0, 229, 255, 0.22);
      transition: border-color 0.2s ease;
    }

    .quest-item.done {
      border-color: rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.08);
      opacity: 0.78;
    }

    .quest-title {
      font-weight: 700;
      font-size: 14.5px;
      margin: 0 0 3px;
    }

    .quest-meta {
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      display: inline-block;
      padding: 2px 7px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: var(--cyan);
      background: rgba(0, 229, 255, 0.08);
    }

    .tag.gold { border-color: rgba(251, 191, 36, 0.4); color: var(--gold); background: rgba(251, 191, 36, 0.08); }
    .tag.purple { border-color: rgba(168, 85, 247, 0.4); color: #d8b4fe; background: rgba(168, 85, 247, 0.1); }
    .tag.crimson { border-color: rgba(244, 63, 94, 0.45); color: #fda4af; background: rgba(244, 63, 94, 0.1); }

    /* RADAR SVG CONTAINER */
    .radar-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .radar-legend {
      display: flex;
      gap: 18px;
      font-size: 12px;
      margin-top: 8px;
    }

    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 6px;
    }

    /* VALUE CHIPS */
    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 16px;
    }

    .chip {
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 700;
      border: 1px solid rgba(0, 229, 255, 0.25);
      background: rgba(5, 14, 32, 0.8);
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .chip.selected {
      border-color: var(--cyan);
      background: rgba(0, 229, 255, 0.2);
      color: #fff;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.25);
    }

    /* SYSTEM TOAST / MODAL */
    .sys-toast {
      margin-bottom: 16px;
      padding: 12px 16px;
      border: 1px solid var(--cyan);
      background: linear-gradient(90deg, rgba(0, 229, 255, 0.18), rgba(8, 19, 43, 0.92));
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 18, 0.85);
      backdrop-filter: blur(6px);
      display: grid;
      place-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-box {
      max-width: 500px;
      width: 100%;
      background: linear-gradient(160deg, #07142e, #0c1029);
      border: 2px solid var(--cyan);
      box-shadow: 0 0 45px rgba(0, 229, 255, 0.4), inset 0 0 25px rgba(0, 229, 255, 0.12);
      padding: 28px;
      text-align: center;
    }

    .substep-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      margin: 5px 0;
      background: rgba(3, 9, 22, 0.75);
      border: 1px solid rgba(0, 229, 255, 0.15);
      font-size: 13.5px;
    }

    .substep-row.done {
      text-decoration: line-through;
      color: var(--text-muted);
      border-color: rgba(16, 185, 129, 0.35);
    }

    .manifesto-box {
      padding: 18px;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.14), rgba(0, 229, 255, 0.10));
      border: 1px solid var(--purple);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.2);
      margin-top: 14px;
    }

    .footer-hud {
      margin-top: 36px;
      padding-top: 18px;
      border-top: 1px solid rgba(0, 229, 255, 0.2);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 860px) {
      .grid-2, .grid-3, .stat-grid { grid-template-columns: 1fr; }
      .hud-header { flex-direction: column; align-items: flex-start; }
      .mini-stat { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- TOP SYSTEM HUD -->
    <header class="hud-header" id="hud-header"></header>

    <!-- NAVIGATION -->
    <nav class="hud-nav" id="hud-nav">
      <button class="hud-tab active" data-tab="status">[STATUS & RADAR ŻYCIA]</button>
      <button class="hud-tab" data-tab="quests">[QUESTY & LOCHY]</button>
      <button class="hud-tab" data-tab="awakening">[PRZEBUDZENIE: KIM JESTEM]</button>
      <button class="hud-tab" data-tab="skills">[UMIEJĘTNOŚCI & SKLEP]</button>
      <button class="hud-tab" data-tab="logs">[LOGI ŁOWCY]</button>
    </nav>

    <!-- NOTIFICATION AREA -->
    <div id="toast-area"></div>

    <!-- MAIN CONTENT -->
    <main id="main-view"></main>

    <!-- FOOTER / BACKUP -->
    <footer class="footer-hud">
      <div>
        <strong>[SYSTEM ARCHIWIZACJI]</strong> Wszystkie dane są zapisywane lokalnie w Twojej przeglądarce. Możesz w każdej chwili pobrać plik zapisu lub wczytać go ponownie.
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-sm" id="btn-export">Eksportuj Zapis (.JSON)</button>
        <label class="btn btn-sm btn-purple" style="cursor:pointer;">
          Wczytaj Zapis
          <input type="file" id="input-import" accept=".json" style="display:none;">
        </label>
        <button class="btn btn-sm btn-danger" id="btn-reset">Reset Systemu</button>
      </div>
    </footer>
  </div>

  <!-- LEVEL UP MODAL CONTAINER -->
  <div id="modal-root"></div>

  <script>
    const STORAGE_KEY = "solo_system_awakening_v2";

    const CORE_STATS = [
      { id: "STR", name: "Siła i Ciało", desc: "Sprawność fizyczna, trening, ruch, dyscyplina ciała" },
      { id: "VIT", name: "Witalność i Regeneracja", desc: "Sen, zdrowie, odżywianie, odporność na stres" },
      { id: "INT", name: "Intelekt i Fachowość", desc: "Nauka, koncentracja, rozwój zawodowy, rozwiązywanie problemów" },
      { id: "PER", name: "Percepcja i Samoświadomość", desc: "Uważność, rozumienie własnych emocji, intuicja i refleksja" },
      { id: "CHA", name: "Charyzma i Relacje", desc: "Bliskość, komunikacja, stawianie granic, budowanie więzi" },
      { id: "WLT", name: "Zasoby i Porządek", desc: "Finanse, organizacja otoczenia, zarządzanie czasem i bezpieczeństwo" }
    ];

        return {
          ...def,
          ...parsed,
          player: { ...def.player, ...(parsed.player || {}), stats: { ...def.player.stats, ...(parsed.player?.stats || {}) } },
          dimensions: { ...def.dimensions, ...(parsed.dimensions || {}) },

      } catch (e) {

      }[c]));

    // WEB AUDIO SYNTHESIZER (Solo Leveling HUD Chimes)
    let audioCtx = null;
    function playSystemSound(type = "click") {
      if (!state.soundEnabled) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) audioCtx = new AudioContextClass();
        if (audioCtx.state === "suspended") audioCtx.resume();

        const now = audioCtx.currentTime;
        const notes = type === "levelup"
          ? [440, 554.37, 659.25, 880, 1108.73]
          : type === "quest"
          ? [523.25, 659.25, 783.99]
          : [587.33];

        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type === "levelup" ? "triangle" : "sine";
          osc.frequency.setValueAtTime(freq, now + idx * 0.075);

          gain.gain.setValueAtTime(0.08, now + idx * 0.075);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.075 + 0.24);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.075);
          osc.stop(now + idx * 0.075 + 0.25);
        });
      } catch (e) {}
    }

    function expForNextLevel(lvl) {
      return 100 + (lvl - 1) * 45;
    }

    function getHunterRank(lvl) {
      if (lvl >= 30) return { label: "MONARCHA CIENI", cls: "monarch" };
      if (lvl >= 20) return { label: "S-RANK", cls: "s-rank" };
      if (lvl >= 14) return { label: "A-RANK", cls: "" };
      if (lvl >= 9) return { label: "B-RANK", cls: "" };
      if (lvl >= 5) return { label: "C-RANK", cls: "" };
      if (lvl >= 3) return { label: "D-RANK", cls: "" };
      return { label: "E-RANK", cls: "" };
    }

    function computeDominantArchetype() {
      const counts = { ARCHITECT: 0, VANGUARD: 0, SAGE: 0, EMPATH: 0 };
      (state.player.archetypeAnswers || []).forEach(ans => {
        if (counts[ans] !== undefined) counts[ans]++;
      });
      let best = "ARCHITECT";
      Object.keys(counts).forEach(k => {
        if (counts[k] > counts[best]) best = k;
      });
      return ARCHETYPE_DATA[best];
    }

    function grantRewards({ exp = 0, gold = 0, stat = null, statAmount = 1, reason = "" }) {
      state.player.exp += exp;
      state.player.gold += gold;
      if (stat && state.player.stats[stat] !== undefined) {
        state.player.stats[stat] += statAmount;
      }

      let leveledUp = false;
      while (state.player.exp >= expForNextLevel(state.player.level)) {
        state.player.exp -= expForNextLevel(state.player.level);
        state.player.level += 1;
        state.player.freePoints += 3;
        leveledUp = true;
      }

      saveState();

      if (leveledUp) {
        playSystemSound("levelup");
        showLevelUpModal();
      } else {
        playSystemSound("quest");
      }

      toastText = `[SYSTEM] ${reason} (+${exp} EXP, +${gold} Złota${stat ? `, +${statAmount} ${stat}` : ""})`;
      render();
    }

    // SVG RADAR CHART GENERATOR (9 LIFE DIMENSIONS)
    function buildRadarChartSVG() {
      const size = 340;
      const cx = size / 2;
      const cy = size / 2;
      const maxR = 115;
      const count = LIFE_DIMENSIONS.length;

      function pointFor(index, value10) {
        const angle = (Math.PI * 2 * index) / count - Math.PI / 2;
        const r = (value10 / 10) * maxR;
        return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
      }

      // Grid rings (2, 4, 6, 8, 10)
      const rings = [2, 4, 6, 8, 10].map(level => {
        const pts = LIFE_DIMENSIONS.map((_, i) => pointFor(i, level).join(",")).join(" ");
        return `<polygon points="${pts}" fill="none" stroke="rgba(0, 229, 255, 0.16)" stroke-width="1"/>`;
      }).join("");

      // Axes & Labels
      const axes = LIFE_DIMENSIONS.map((dim, i) => {
        const [xEnd, yEnd] = pointFor(i, 10);
        const [xLbl, yLbl] = pointFor(i, 12.3);
        const score = state.dimensions[dim.id]?.current ?? 5;
        return `
          <line x1="${cx}" y1="${cy}" x2="${xEnd}" y2="${yEnd}" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1"/>
          <text x="${xLbl}" y="${yLbl}" fill="#bfe6ff" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">
            ${esc(dim.name)} (${score})
          </text>
        `;
      }).join("");

      const targetPts = LIFE_DIMENSIONS.map((dim, i) =>
        pointFor(i, state.dimensions[dim.id]?.target ?? 8).join(",")
      ).join(" ");

      const currentPts = LIFE_DIMENSIONS.map((dim, i) =>
        pointFor(i, state.dimensions[dim.id]?.current ?? 5).join(",")
      ).join(" ");

      return `
        <svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:360px; overflow:visible;">
          ${rings}
          ${axes}
          <polygon points="${targetPts}" fill="rgba(168, 85, 247, 0.12)" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3"/>
          <polygon points="${currentPts}" fill="rgba(0, 229, 255, 0.25)" stroke="#00e5ff" stroke-width="2.2"/>
        </svg>
      `;
    }
